# Eval
# These settings only apply when running eval.py (instead of ppo.py)
eval:
  episode_length: 200
  n_parallel: 5  # Number of eval envs to be run in parallel
  training_name: launch_dummy_SAC_run  # Path to stored model, relative to Wind-RL/
  model_id: 515  # ID of model to be evaluated
  save_flow: False
  dummy_update: True

# Configure hydra
hydra:
  run:
    dir: outputs
  output_subdir: hydra_logs
  
