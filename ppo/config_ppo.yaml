# task and env
env:
  n_parallel: 2
  n_processors_per_env: 2
  dummy_update: False
  env_name: WindFarm
  turbines: 3
  probes_per_turbine: 60
  turbine_diameter: 126
  turbine_height: 90
  turbine_spacing: 7
  max_yaw_speed: 0.25
  max_yaw_angle: 40
  steps_per_frame: 50
  reset_frames: 150
  frame_stack: 5  # Number of frames to be stacked as agent input

# collector
collector:
  frames_per_batch: 200 # this is the actual number of frames we see in a batch
  max_episode_length: 1_000  # Timesteps (disregarding frame skip)
  total_frames: 50_000  # Timesteps (disregarding frame skip)

# logger
logger:
  logging_stream: stdout  # stdout to print to console or empty (None) to print to standard log file

# Optim
optim:
  lr: 1e-4
  weight_decay: 0.0
  anneal_lr: True

# Settings for checkpointing
checkpoint:
  checkpoint_interval: 10
  load_from_checkpoint: False
  model_checkpoint_path: utils/checkpoint_test   # Path to checkpoint, RELATIVE to Wind-RL/
  model_checkpoint_id: 2000  # ID of checkpoint

# loss
loss:
  gamma: 0.99
  mini_batch_size: 25  # must be less than frames per batch
  ppo_epochs: 10
  gae_lambda: 0.95
  clip_epsilon: 0.2
  anneal_clip_epsilon: False
  critic_coef: 0.25
  entropy_coef: 0.0
  loss_critic_type: l2

# Eval
# These settings only apply when running eval.py (instead of ppo.py)
eval:
  episode_length: 1_000
  n_parallel: 5  # Number of eval envs to be run in parallel
  model_path: utils/checkpoint_test  # Path to stored model, relative to Wind-RL/
  model_id: 4200  # ID of model to be evaluated

# Configure hydra
hydra:
  run:
    dir: outputs
  output_subdir: hydra_logs
  