# environment and task
env:
  n_parallel: 32
  n_processors_per_env: 128
  dummy_update: False
  env_name: WindFarm
  turbines: 3
  probes_per_turbine: 60
  flow_field_directions: ['ux']  # we will use these components of the flow field for each probe
  turbine_diameter: 126
  turbine_height: 90
  turbine_spacing: 5
  turbine_spacing_z: 7
  max_yaw_speed: 0.4
  max_yaw_angle: 40
  steps_per_frame: 50
  reset_frames: 150
  # reset_frames: 3000  # combined for eval
  initial_reset_frames: 2500
  frame_stack: 5  # Number of frames to be stacked as agent input
  penalty_scale: 0.5
  penalty_exp: 26
  random_reset: False  # If True, at each reset angles will be chosen randomly

# collector
collector:
  total_frames: 200_000
  init_random_frames: 25_000
  max_episode_length: 500  # Timesteps (disregarding frame skip)
  frames_per_batch: 500
  device: cpu
  reset_at_each_iter: False

# replay buffer
replay_buffer:
  size: ${collector.total_frames}
  prb: False # use prioritized experience replay; the original TQC paper does not prioritized replay
  scratch_dir:

# optim
optim:
  utd_ratio: 1.0
  actuator_loss_weight: 0.0  # Weight hyperparameter of actuation size in reward function
  gamma: 0.99
  lr: 3.0e-4
  weight_decay: 0.0  # L2 regularisation | Works well for LSTM | For attention weight_decay > 0 leads to NaNs
  batch_size: 256
  target_update_polyak: 0.995
  alpha_init: 1.0
  adam_eps: 1.0e-8

# network
network:
  actor_hidden_sizes: [256, 256]
  critic_hidden_sizes: [256, 256]
  activation: relu  # The original TQC paper uses ReLu
  default_policy_scale: 1.0
  scale_lb: 0.1
  device: cpu
  auto_detect_device: True  # If True, will use GPU when available or else fall back on device specified above

# logging
logger:
  backend: wandb
  mode: online
  eval_iter: 20  # Evaluate every x batches
  test_episode_length: 150
  num_eval_envs: 20
  project_name: LatentRL
  team_name: why_are_all_the_good_names_taken_aaa
  save_replay_buffer: False

# Disable output subdirectory
hydra:
  output_subdir: config
